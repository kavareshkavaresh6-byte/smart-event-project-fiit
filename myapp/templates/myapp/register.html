{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Register - Smart Event Booking</title>
    <link rel="stylesheet" href="{% static 'myapp/register.css' %}">
        <link rel="stylesheet" href="{% static 'myapp/navbar.css' %}">
</head>

<body>

    <nav>
        <a href="/">Home</a>
        <a href="/events/">Events</a>
        <a href="/login/">Login</a>
        <a href="/register/">Register</a>
    </nav>

    <h1>Create Account</h1>
    <p>Create your account to book and manage events easily.</p>

    <form method="POST">
        {% csrf_token %}

        <label>Username:</label>
        <input type="text" name="username" required>

        <br><br>

        <label>Email:</label>
        <input type="email" name="email" required>

        <br><br>

        <label>Password:</label>
        <input type="password" name="password" required>

        <br><br>

        <button type="submit">Register</button>
    </form>
<script>
    document.querySelector("form").addEventListener("submit", function(event) {

        let username = document.querySelector('input[name="username"]').value.trim();
        let email = document.querySelector('input[name="email"]').value.trim();
        let password = document.querySelector('input[name="password"]').value;

        if (username === "") {
            alert("Please enter your username.");
            event.preventDefault();
            return;
        }

        if (email === "") {
            alert("Please enter your email.");
            event.preventDefault();
            return;
        }

        if (password === "") {
            alert("Please enter your password.");
            event.preventDefault();
            return;
        }

        if (password.length < 8) {
            alert("Password must contain at least 8 characters.");
            event.preventDefault();
            return;
        }

        let confirmRegister = confirm("Do you want to create this account?");

        if (!confirmRegister) {
            event.preventDefault();
        }

    });
</script>
</body>
</html>
